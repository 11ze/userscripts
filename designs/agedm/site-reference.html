<script>
'use strict';
const cards=[...document.querySelectorAll('.video_item')];
for(const card of cards){const name=card.querySelector('.video_item-title a').textContent.trim();card.dataset.designName=name;const b=document.createElement('button');b.className='design-block';b.setAttribute('aria-label','屏蔽'+name);b.innerHTML='<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3L9 9M9 3L3 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>';b.addEventListener('click',()=>parent.postMessage({type:'agedm-block',name},location.origin));card.appendChild(b);}
addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||e.data.type!=='agedm-state')return;for(const card of cards){card.parentElement.hidden=e.data.enabled&&e.data.blocked.includes(card.dataset.designName);card.querySelector('button.design-block').hidden=!e.data.enabled;}});
document.querySelectorAll('a,form').forEach(el=>el.addEventListener(el.tagName==='FORM'?'submit':'click',e=>e.preventDefault()));
parent.postMessage({type:'agedm-ready',names:cards.map(c=>c.dataset.designName)},location.origin);
</script></body></html>
