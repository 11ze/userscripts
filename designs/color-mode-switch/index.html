<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>亮暗色切换 · 按钮定稿基准</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif;
  }

  /* ───────────── artboard 页面骨架（按钮的场景语境） ───────────── */
  .pgm { position: absolute; inset: 0; overflow: hidden; }
  .pgm-nav { display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 38px; }
  .pgm-logo { width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0; }
  .pgm-navitem { width: 34px; height: 8px; border-radius: 4px; }
  .pgm-body { display: flex; gap: 14px; padding: 16px 16px 0; }
  .pgm-main { flex: 1; min-width: 0; }
  .pgm-head { height: 16px; border-radius: 5px; width: 62%; margin-bottom: 12px; }
  .pgm-line { height: 8px; border-radius: 4px; margin-bottom: 8px; }
  .pgm-side { width: 128px; height: 118px; border-radius: 8px; flex-shrink: 0; }
  .pgm-body2 { padding: 14px 16px 0; }

  .pgm--light { background: #f7f6f3; }
  .pgm--light .pgm-logo { background: rgba(0,0,0,.32); }
  .pgm--light .pgm-navitem { background: rgba(0,0,0,.12); }
  .pgm--light .pgm-head { background: rgba(0,0,0,.30); }
  .pgm--light .pgm-line { background: rgba(0,0,0,.12); }
  .pgm--light .pgm-side { background: linear-gradient(135deg, #c8d3e2, #93a7c2); }

  .pgm--dark { background: #14161a; }
  .pgm--dark .pgm-logo { background: rgba(255,255,255,.4); }
  .pgm--dark .pgm-navitem { background: rgba(255,255,255,.14); }
  .pgm--dark .pgm-head { background: rgba(255,255,255,.36); }
  .pgm--dark .pgm-line { background: rgba(255,255,255,.14); }
  .pgm--dark .pgm-side { background: linear-gradient(135deg, #2b3444, #45546e); }

  /* ───────────── 按钮公共：fixed 右上 20px 的替身 ───────────── */
  .cmw { position: absolute; top: 20px; right: 20px; z-index: 5; }

  .cm-tip {
    position: absolute; top: 50%; right: calc(100% + 10px);
    transform: translateY(-50%) translateX(4px);
    /* 描边对齐 v0.1.3 实现：暗页上黑底气泡无描边则边界不可见 */
    background: rgba(20,20,20,.92); color: #fff;
    border: 1px solid rgba(255,255,255,.25);
    font-size: 12px; line-height: 1; padding: 7px 9px; border-radius: 6px;
    white-space: nowrap; opacity: 0; pointer-events: none;
    transition: opacity .16s ease, transform .16s ease;
  }
  .cmw:hover .cm-tip { opacity: 1; transform: translateY(-50%) translateX(0); }

  /* ───────────── 定稿 · 墨盘：黑圆 + 发丝描边（= v0.1.3 实现） ───────────── */
  .cma-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: #000; border: 1px solid rgba(255,255,255,.22);
    cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.28);
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .cmw-a:hover .cma-btn {
    transform: translateY(-2px);
    border-color: rgba(255,255,255,.55);
    box-shadow: 0 6px 18px rgba(0,0,0,.32);
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="directions.jsx"></script>
</body>
</html>
