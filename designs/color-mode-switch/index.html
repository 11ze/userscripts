<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>亮暗色切换 · 改进设计</title>
  <!-- 两个画板均运行当前脚本。亮页来自暗色内容，暗页来自亮色内容；未另画一套转换后的颜色。 -->
  <style>
    :root { color-scheme: light; --paper:#eeeee9; --ink:#292d29; --muted:#5d655d; --line:#d1d5cc; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:14px/1.75 -apple-system,"SF Pro Text","PingFang SC","Noto Sans SC",sans-serif; }
    main { max-width:1280px; margin:auto; padding:30px clamp(18px,4vw,48px) 24px; }
    .heading { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:26px; }
    h1 { font-size:26px; font-weight:650; letter-spacing:-.04em; line-height:1.3; margin:0 0 6px; }
    .heading p { color:var(--muted); margin:0; }
    button { font:inherit; color:var(--ink); background:#f9faf6; border:1px solid var(--line); border-radius:6px; min-height:42px; padding:7px 14px; cursor:pointer; }
    button:hover { border-color:#6b7f6c; }
    button:focus-visible,a:focus-visible { outline:3px solid #52795d; outline-offset:3px; }
    .screens { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); align-items:start; gap:26px; }
    article { min-width:0; }
    .label { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin:0 0 10px; }
    h2 { margin:0; font-size:16px; font-weight:620; }
    .label span { color:var(--muted); font-size:12px; }
    iframe { display:block; width:100%; height:1120px; border:1px solid #c9cec4; border-radius:8px; background:#fff; box-shadow:0 4px 18px #242c2410; }
    footer { display:flex; flex-wrap:wrap; gap:8px 22px; color:var(--muted); font-size:12px; margin-top:18px; }
    footer a { color:inherit; text-underline-offset:3px; }
    @media (max-width:760px) { .screens { grid-template-columns:1fr; gap:28px; } main { padding-top:22px; } iframe { height:1180px; } }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto !important; } }
  </style>
</head>
<body>
<main>
  <header class="heading">
    <div><h1>亮暗色切换</h1><p>柔化明暗两端，保留文字层次与媒体中间色。</p></div>
    <button id="reload" type="button">重新预览</button>
  </header>
  <section class="screens" aria-label="改进后的亮暗设计">
    <article data-screen-label="改进后的亮色">
      <div class="label"><h2>亮色</h2><span>暗页 → 亮页</span></div>
      <iframe id="light-preview" title="改进后的亮色页面" allowfullscreen></iframe>
    </article>
    <article data-screen-label="改进后的暗色">
      <div class="label"><h2>暗色</h2><span>亮页 → 暗页</span></div>
      <iframe id="dark-preview" title="改进后的暗色页面" allowfullscreen></iframe>
    </article>
  </section>
  <footer><span>点击画板中的月亮可还原配色。</span><a href="https://images.unsplash.com/photo-1441974231531-c6227db76b6e" target="_blank" rel="noreferrer">照片：Unsplash</a><a href="https://unsplash.com/license" target="_blank" rel="noreferrer">素材许可</a></footer>
</main>
<template id="reading-page">
  <header class="navigation"><strong>阅读样例</strong><nav aria-label="页内导航"><a href="#reading">正文</a><a href="#photo">图片</a></nav></header>

    <figure id="photo"><picture><source srcset="assets/forest.jpg" type="image/jpeg"><img src="assets/forest.jpg" width="960" height="639" alt="阳光穿过森林，照亮绿色树叶与林间小路"></picture><figcaption>林间的绿、阳光与阴影，保留自然的颜色关系。</figcaption></figure>
    <section class="details" id="details" aria-labelledby="detail-title">
      <h2 id="detail-title">阅读层次</h2>
      <div class="detail-row"><strong>正文</strong><span>清楚，易读</span></div>
      <div class="detail-row"><strong>次要信息</strong><span class="secondary">减弱强调，保留辨识度</span></div>
      <div class="detail-row"><strong>分隔与边界</strong><span class="secondary">帮助区分内容</span></div>
    </section>
    <section class="colors" aria-labelledby="colors-title">
      <h2 id="colors-title">图表与颜色</h2>
      <svg id="chart" viewBox="0 0 420 96" role="img" aria-label="红绿蓝色条样例"><rect width="420" height="96" rx="5" fill="#f5f5f5"></rect><text x="14" y="24" fill="currentColor" font-size="12">示例颜色</text><rect x="14" y="39" width="100" height="16" fill="#bb4c4c"></rect><rect x="14" y="65" width="160" height="16" fill="#458561"></rect><svg id="nested-svg" x="248" y="25" width="145" height="55" viewBox="0 0 145 55"><rect x="0" y="14" width="135" height="24" fill="#476caf"></rect></svg></svg>
    </section>
    <section class="search" aria-labelledby="search-title">
      <h2 id="search-title">输入与代码</h2>
      <label for="query">输入文字</label>
      <div class="form-row"><input id="query" placeholder="检查输入文字的可读性"><button type="button" id="confirm">检查</button></div>
      <p class="secondary" id="search-result" aria-live="polite">输入内容后点击检查。</p>
      <pre><code>const theme = 'readable';</code></pre>

    <details class="media-check">
      <summary>图片效果与视频</summary>
      <figure><img id="gray-photo" src="assets/forest.jpg" width="960" height="639" style="filter:grayscale(1)!important" alt="保留原有灰度效果的森林照片"><figcaption>图片原有的灰度效果保持不变。</figcaption></figure>
      <video id="sample-video" autoplay muted playsinline aria-label="红绿蓝等六色色条视频"></video>
      <button id="video-fullscreen" type="button">全屏播放</button>
    </details>
  </main>

<script id="script-source" type="application/json">"// ==UserScript==\n// @name         亮暗色切换\n// @namespace    https://github.com/11ze\n// @version      0.1.5\n// @description  2026-10-31 对比度调整为 0.95，修复全屏视频偏色与固定黑白 SVG 隐身，保留站点原有媒体滤镜\n// @author       11ze\n// @match        *://*/*\n// @run-at       document-start\n// @noframes\n// @icon         data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0Ij48cGF0aCBmaWxsPSJjdXJyZW50Q29sb3IiIGQ9Ik0xMiAyMmM1LjUyMyAwIDEwLTQuNDc3IDEwLTEwYzAtLjQ2My0uNjk0LS41NC0uOTMzLS4xNDNhNi41IDYuNSAwIDEgMS04LjkyNC04LjkyNEMxMi41NCAyLjY5MyAxMi40NjMgMiAxMiAyQzYuNDc3IDIgMiA2LjQ3NyAyIDEyczQuNDc3IDEwIDEwIDEwIi8+PC9zdmc+\n// @grant        GM_addStyle\n// @grant        GM_registerMenuCommand\n// @license      MIT\n// ==/UserScript==\n\n(function () {\n  'use strict';\n\n  const STORAGE_KEY = '11ze_color_mode_switch_reverse_color_mode';\n  const TOGGLE_CONTAINER_ID = '11ze-reverse-color-mode-toggle-container';\n  const PAGE_FILTER = 'invert(1) hue-rotate(180deg) contrast(0.95)';\n  // 逆序补偿页面滤镜；极端高光与阴影受色域裁切限制，无法完全恢复。\n  const MEDIA_FILTER = 'contrast(1.0526315789473684) hue-rotate(180deg) invert(1)';\n  const MEDIA_SELECTOR = 'img, video, iframe, canvas, svg';\n  const ORIGINAL_FILTER_PROPERTY = '--11ze-original-filter';\n\n  /**\n   * 状态存取：storage 由调用方注入，异常（隐私模式/配额）时读出关闭、写返回 false\n   */\n  function readState(storage) {\n    try {\n      return storage.getItem(STORAGE_KEY) === 'true';\n    } catch {\n      return false;\n    }\n  }\n\n  function writeState(storage, reverseColorMode) {\n    try {\n      storage.setItem(STORAGE_KEY, reverseColorMode.toString());\n      return true;\n    } catch {\n      return false;\n    }\n  }\n\n  /**\n   * 反转样式表：整页反转、媒体与自挂按钮二次反转抵消、\n   * 逃生舱元素仅清除自身 filter（CSS filter 下子树无法脱离整页反转）\n   */\n  function buildReverseColorCss() {\n    return `\n      html {\n        filter: ${PAGE_FILTER} !important;\n      }\n\n      img, video, iframe, canvas, svg,\n      [id='${TOGGLE_CONTAINER_ID}'] {\n        filter: var(--11ze-original-filter, ) ${MEDIA_FILTER} !important;\n      }\n\n      /* 容器已带二次反转，容器内 img 再被上面的媒体规则命中会叠成三层（奇数）反转，白色图标变黑底黑字 */\n      [id='${TOGGLE_CONTAINER_ID}'] img {\n        filter: var(--11ze-original-filter, none) !important;\n      }\n\n      /* 单色 SVG 随文字变色；用计算后的颜色识别固定黑白和 currentColor */\n      svg[data-11ze-monochrome] {\n        filter: var(--11ze-original-filter, none) !important;\n      }\n\n      /* 嵌套 SVG 共享最外层的处理，不能逐层叠加滤镜 */\n      svg svg {\n        filter: var(--11ze-original-filter, none) !important;\n      }\n\n      /* 逃生舱仅此类名：data-theme 之类的属性选择器特异性高于 html，会反杀整页反转；\n         且 filter:none 无法让子树脱离反转，本就只对媒体二次反转有效 */\n      .reverse-color-mode-ignore {\n        filter: var(--11ze-original-filter, none) !important;\n      }\n\n      /* 全屏内容进入顶层后不再受 html 滤镜影响，只保留站点原有滤镜 */\n      :fullscreen,\n      :fullscreen :is(img, video, iframe, canvas, svg),\n      :fullscreen [id='${TOGGLE_CONTAINER_ID}'] {\n        filter: var(--11ze-original-filter, none) !important;\n      }\n    `;\n  }\n\n  // 与 @icon 分家：按钮底 #000 需白月（img 独立文档 currentColor 回落黑，黑底不可见）；\n  // @icon 底是油猴浅色面板需 currentColor（回落黑）。两份 base64 人肉同步，\n  // 形状一致性（剥 fill 后逐字节一致）由测试锁定，改月亮路径须两处同改\n  const ICON_SUN_DATA_URI =\n    'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0Ij48cGF0aCBmaWxsPSIjZmZmIiBkPSJNMTIgMjJjNS41MjMgMCAxMC00LjQ3NyAxMC0xMGMwLS40NjMtLjY5NC0uNTQtLjkzMy0uMTQzYTYuNSA2LjUgMCAxIDEtOC45MjQtOC45MjRDMTIuNTQgMi42OTMgMTIuNDYzIDIgMTIgMkM2LjQ3NyAyIDIgNi40NzcgMiAxMnM0LjQ3NyAxMCAxMCAxMCIvPjwvc3ZnPg==';\n\n  // 定稿「墨盘」（designs/color-mode-switch/ 方向 A，2026-10-31）：\n  // 黑底发丝描边补暗页隐身（黑底唯一隐身场景是反转后暗页——亮站转暗，罕用），\n  // hover 三联动（上浮/描边亮/浮字），常态全不透明（0.7 会把描边压没）\n  const STYLES = {\n    container: {\n      position: 'fixed',\n      top: '20px',\n      right: '20px',\n      zIndex: '9999',\n    },\n    button: {\n      width: '40px',\n      height: '40px',\n      borderRadius: '50%',\n      border: '1px solid rgba(255, 255, 255, 0.22)',\n      // 按钮只在反转开启时显示，主场景暗转亮——反转后的亮页上黑底白月对比度最高\n      backgroundColor: '#000',\n      // 描边只保暗页下限，阴影保反转后亮页上不悬空；描边 hover 变亮是主反馈\n      boxShadow: '0 2px 10px rgba(0, 0, 0, 0.28)',\n      cursor: 'pointer',\n      // tooltip 的定位锚点（挂 button 内：display:none 级联隐藏、随按钮位移）\n      position: 'relative',\n      // 站点全局 button/overflow 样式会裁掉探出按钮左侧的 tooltip\n      overflow: 'visible',\n      fontSize: '20px',\n      display: 'flex',\n      alignItems: 'center',\n      justifyContent: 'center',\n      transition: 'transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease',\n    },\n    buttonHover: {\n      transform: 'translateY(-2px)',\n      borderColor: 'rgba(255, 255, 255, 0.55)',\n      boxShadow: '0 6px 18px rgba(0, 0, 0, 0.32)',\n    },\n    buttonNormal: {\n      transform: 'none',\n      borderColor: 'rgba(255, 255, 255, 0.22)',\n      boxShadow: '0 2px 10px rgba(0, 0, 0, 0.28)',\n    },\n    icon: {\n      width: '24px',\n      height: '24px',\n      // 站点全局 img 样式会命中此图标打出方框，四项内联重置挡住\n      border: 'none',\n      outline: 'none',\n      padding: '0',\n      background: 'none',\n    },\n    tooltip: {\n      // 挂 button 内：关闭态 display:none 级联隐藏，无需单独同步显隐\n      position: 'absolute',\n      top: '50%',\n      right: 'calc(100% + 10px)',\n      transform: 'translateY(-50%) translateX(4px)',\n      // 暗页上黑底气泡无描边则边界不可见，与按钮描边同理\n      background: 'rgba(20, 20, 20, 0.92)',\n      border: '1px solid rgba(255, 255, 255, 0.25)',\n      color: '#fff',\n      fontSize: '12px',\n      lineHeight: '1',\n      padding: '7px 9px',\n      borderRadius: '6px',\n      whiteSpace: 'nowrap',\n      opacity: '0',\n      // 不参与 hover：鼠标扫过 tooltip 不算离开容器，防连击抖动\n      pointerEvents: 'none',\n      transition: 'opacity 0.16s ease, transform 0.16s ease',\n    },\n    tooltipHover: {\n      opacity: '1',\n      transform: 'translateY(-50%) translateX(0)',\n    },\n    tooltipNormal: {\n      opacity: '0',\n      transform: 'translateY(-50%) translateX(4px)',\n    },\n  };\n\n  function setStyles(el, styles) {\n    Object.assign(el.style, styles);\n  }\n\n  function setHover(el, applyHover) {\n    // mouseenter/mouseleave 不冒泡；mouseover/mouseout 会在容器与子按钮间连击导致样式抖动\n    el.addEventListener('mouseenter', function () {\n      applyHover(true);\n    });\n    el.addEventListener('mouseleave', function () {\n      applyHover(false);\n    });\n  }\n\n  function createEl(tag, styles = {}, props = {}) {\n    const el = document.createElement(tag);\n    setStyles(el, styles);\n    Object.assign(el, props);\n    return el;\n  }\n\n  let isReverseColorMode = readState(localStorage);\n  let reverseColorModeStyle = null;\n  let toggleButtonElement = null;\n  let mediaObserver = null;\n  const mediaStyles = new Map();\n\n  function isMonochromeSvg(svg) {\n    // 图片、外部符号和渐变不能从当前绘制色判断，保留媒体处理。\n    if (svg.querySelector('image, foreignObject, use')) return false;\n    const shapes = [svg, ...svg.querySelectorAll('path, rect, circle, ellipse, line, polyline, polygon, text')];\n    return shapes.every(function (shape) {\n      const style = getComputedStyle(shape);\n      return [style.fill, style.stroke].every(function (paint) {\n        if (paint === 'none' || paint === 'transparent') return true;\n        const match = paint.match(/^rgba?\\(([^)]+)\\)$/);\n        if (!match) return false;\n        const channels = match[1].split(/[,\\s/]+/).map(Number);\n        return channels[3] === 0 || (channels[0] === channels[1] && channels[1] === channels[2]);\n      });\n    });\n  }\n\n  function updateMediaStyles(root) {\n    const elements = new Set(root.querySelectorAll(MEDIA_SELECTOR));\n    if (root === document && document.fullscreenElement) elements.add(document.fullscreenElement);\n    if (root.nodeType === 1 && (root.matches(MEDIA_SELECTOR) || root === document.fullscreenElement)) {\n      elements.add(root);\n    }\n    for (let svg = root.closest?.('svg'); svg; svg = svg.parentElement?.closest('svg')) elements.add(svg);\n    if (!elements.size) return;\n\n    // 同步读取期间停用脚本样式，避免把自己的补偿重新采集为站点滤镜。\n    const disabled = reverseColorModeStyle.disabled;\n    reverseColorModeStyle.disabled = true;\n    try {\n      const originals = [];\n      for (const element of elements) {\n        if (!element.isConnected) continue;\n        const previous = mediaStyles.get(element);\n        let inlineFilter = element.style.getPropertyValue('filter');\n        let priority = element.style.getPropertyPriority('filter');\n        if (previous?.appliedFilter && inlineFilter === previous.appliedFilter && priority === 'important') {\n          inlineFilter = previous.inlineFilter;\n          priority = previous.priority;\n          element.style.setProperty('filter', inlineFilter, priority);\n        }\n        originals.push({ element, inlineFilter, priority });\n      }\n      // 先读取整批原值，防止 filter:inherit 读到父媒体刚挂上的补偿。\n      const captured = originals.map(function (original) {\n        const { element } = original;\n        return { ...original, filter: getComputedStyle(element).filter,\n          monochrome: element.matches('svg') && isMonochromeSvg(element) };\n      });\n      for (const { element, inlineFilter, priority, filter, monochrome } of captured) {\n        // initial 阻止私有属性从外层媒体继承，none 又不能与滤镜函数拼接。\n        element.style.setProperty(ORIGINAL_FILTER_PROPERTY, filter === 'none' ? 'initial' : filter);\n        if (element.matches('svg')) {\n          if (monochrome) element.setAttribute('data-11ze-monochrome', '');\n          else element.removeAttribute('data-11ze-monochrome');\n        }\n        // 内联 important 同时覆盖站点样式表中的 important，原值留待关闭时恢复。\n        const compensate = element.matches(MEDIA_SELECTOR) && !monochrome &&\n          element !== document.fullscreenElement &&\n          !element.matches('svg svg, .reverse-color-mode-ignore, :fullscreen *') &&\n          !(element.matches('img') && element.closest(`[id='${TOGGLE_CONTAINER_ID}']`));\n        con <script>
  'use strict';
  const source = JSON.parse(document.getElementById('script-source').textContent);
  const baseUrl = new URL('.', location.href).href;
  const pageStyles = `
    * { box-sizing:border-box; } html,body { margin:0; background:var(--bg); color:var(--fg); }

    :root[data-theme="light"] #fixed-icon { fill:#000; }
    body { font:15px/1.8 -apple-system,"SF Pro Text","PingFang SC","Noto Sans SC",sans-serif; }
    .navigation { display:flex; align-items:center; flex-wrap:wrap; gap:20px; padding:18px 78px 18px 26px; border-bottom:1px solid var(--line); font-size:12px; }
    nav { display:flex; gap:14px; } nav a { color:var(--secondary); text-decoration:none; }
    .reading { padding:26px; max-width:620px; margin:auto; }
    .eyebrow { color:var(--secondary); font-size:11px; letter-spacing:.08em; }
    h1 { font-size:clamp(25px,5.5vw,32px); line-height:1.35; letter-spacing:-.04em; margin:8px 0 15px; font-weight:650; }
    h2 { font-size:14px; margin:0 0 12px; font-weight:620; } p { margin:10px 0; } .lead { font-size:17px; }

    .icon-row { display:flex; gap:12px; align-items:center; margin-top:18px; color:var(--secondary); font-size:12px; }

    figcaption { font-size:11px; color:var(--secondary); margin-top:8px; }

      const shim = `let state = 'true';
        Object.defineProperty(window, 'localStorage', { value: { getItem() { return state; }, setItem(key, value) { state = value; } } });
        window.GM_addStyle = function (css) { const style = document.createElement('style'); style.dataset.reverseColor = ''; style.textContent = css; document.head.appendChild(style); return style; };

      const interactions = `document.querySelectorAll('a[href^="#"]').forEach(link => link.addEventListener('click', event => { event.preventDefault(); document.querySelector(link.getAttribute('href')).scrollIntoView(); }));
        document.getElementById('confirm').addEventListener('click', () => { document.getElementById('search-result').textContent = document.getElementById('query').value ? '输入文字清晰可读。' : '请先输入文字。'; });

  render();
